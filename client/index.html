<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: the ICV crest -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2449" />

    <!-- SEO: title, description and social tags match the live icv.edu.au home page -->
    <meta name="description" content="International College of Victoria (ICV) is a leading RTO delivering hands on training to both local and international students from Certificate to Diploma courses in various industry." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://icv.edu.au/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="International College of Victoria – Study at ICV" />
    <meta property="og:description" content="International College of Victoria (ICV) is a leading RTO delivering hands on training to both local and international students from Certificate to Diploma courses in various industry." />
    <meta property="og:url" content="https://icv.edu.au/" />
    <meta property="og:site_name" content="ICV" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "@id": "https://icv.edu.au/",
            "url": "https://icv.edu.au/",
            "name": "International College of Victoria – Study at ICV",
            "isPartOf": { "@id": "https://icv.edu.au/#website" },
            "description": "International College of Victoria (ICV) is a leading RTO delivering hands on training to both local and international students from Certificate to Diploma courses in various industry.",

          {

            "name": "ICV",
            "inLanguage": "en-US"
          }
        ]
      }

    <!-- Hero: poster is the LCP image, fetched before JS runs -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-poster-1280.webp"
      imagesrcset="/images/hero-poster-640.webp 640w, /images/hero-poster-1280.webp 1280w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="preload" as="image" type="image/webp" href="/images/icv-crest-112.webp" imagesrcset="/images/icv-crest-169.webp 1.5x" />

    <!-- Warm up Vimeo connections so the background video starts fast -->
    <link rel="preconnect" href="https://player.vimeo.com" />
    <link rel="preconnect" href="https://i.vimeocdn.com" />
    <link rel="preconnect" href="https://f.vimeocdn.com" />
    <link rel="preconnect" href="https://vod-adaptive-ak.vimeocdn.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300..900;1,400&display=swap"
    />
    <!-- Free blackletter fallback for the logo wordmark, subset to its letters only -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&text=InternationalCollegeofVictoria&display=swap"
    />
